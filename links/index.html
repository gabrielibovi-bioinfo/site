<title>Gabrieli Bovi | Bioinformática</title>
<meta name="description" content="Análise de dados NGS: metagenômica 16S, RNA-seq, proteômica e variant calling.">
<meta property="og:title" content="Gabrieli Bovi | Bioinformática">
<meta property="og:description" content="Análise de dados NGS para pesquisadores e laboratórios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F6F2;--ink:#1C1C1A;--muted:#5F5F5A;--pink:#C2185B;--pinkbg:#FAE4EE;--green:#4A7D1C;--greenbg:#E9F3DE;--line:#E4E2DC}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:40px 20px 48px}
main{width:100%;max-width:460px;text-align:center}
.logo{width:150px;height:auto;display:block;margin:0 auto 18px}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.role{margin-top:6px;color:var(--pink);font-weight:600;font-size:15px}
.about{margin:14px auto 0;color:var(--muted);font-size:15px;line-height:1.55;max-width:380px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 28px}
.chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:6px 12px;border-radius:10px}
.chip.p{background:var(--pinkbg);color:var(--pink)}.chip.g{background:var(--greenbg);color:var(--green)}
.links{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.07);border-color:var(--pink);outline:none}
.btn b{display:block;font-size:16px;font-weight:600}
.btn small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.btn .arrow{color:var(--pink);font-size:20px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.primary small,.btn.primary .arrow{color:#fff;opacity:.9}
footer{margin-top:32px;color:var(--muted);font-size:12px}
</style>
</head>
